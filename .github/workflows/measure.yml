name: Measure runtime image

# Runs only on pushes to this branch, never on main. It records start time, job time and
# memory for choosing where to deploy the backend, and is not part of CI.
on:
  push:
    branches: [measure/runtime-sizing]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the checkpoint
        run: python3 scripts/fetch_checkpoint.py

      - name: Build the runtime stage
        run: docker build --pull --target runtime -t harmonyrestorer:runtime .

      - name: Measure on two cores
        run: scripts/measure_runtime_image.sh harmonyrestorer:runtime

      # The same lengths on every core of the runner, for comparison with the row above
      - name: Measure on every core
        env:
          CPUSET: ""
        run: scripts/measure_runtime_image.sh harmonyrestorer:runtime
