name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install project dependencies
        run: uv sync --frozen --all-groups --all-extras

      # One tracked definition of the gate, invoked identically here and locally, so
      # local green and CI green cannot drift. Adding a check means editing the script,
      # not two places. See scripts/gate_python.sh for what runs and why.
      - name: Gate (lint, types, security, audit, tests, secrets)
        run: scripts/gate_python.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
