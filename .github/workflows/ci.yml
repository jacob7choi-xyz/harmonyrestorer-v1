name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least privilege, declared here rather than inherited from the repository default,
# which this file cannot see. Nothing in either job writes to the repository.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs because a tag can be moved to
# different code after review; the comment records the release the SHA was taken from.
# Each SHA was resolved from its tag and confirmed as a signed commit when pinned.

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      # The token is not persisted into .git/config, so dependency install scripts that
      # run in later steps cannot read it. No step here pushes or fetches after checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv is pinned with its checksum. This action release only embeds checksums up to
      # 0.12.17, so without the explicit value it would verify 0.12.23 against a manifest
      # fetched over the network on every run. Pinning moves the expected bytes into
      # reviewed source. The value matches the release asset and its signed SLSA
      # provenance from astral-sh/uv. Changing the version means changing the checksum
      # alongside it. The value is a public artifact digest, so the secrets scan is
      # exempted on that one line only.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6" # pragma: allowlist secret
          python-version: "3.11"
          enable-cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install project dependencies
        run: uv sync --frozen --all-groups --all-extras

      # One tracked definition of the gate, invoked identically here and locally, so
      # local green and CI green cannot drift. Adding a check means editing the script,
      # not two places. See scripts/gate_python.sh for what runs and why.
      - name: Gate (lint, types, security, audit, tests, secrets)
        run: scripts/gate_python.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
